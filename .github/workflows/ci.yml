name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # brew 的 ffmpeg 是 vendor 闭包拷贝的来源,仍需安装
      - run: brew install ffmpeg pkgconf
      - run: ./scripts/vendor-macos.sh
      # 测试与发布用同一 vendor 环境一次编译(缓存有效),测的就是分发的 vendor 形态;
      # 系统/brew 链接路径由本地覆盖
      - name: Test against vendored FFmpeg
        run: cargo test --all
        env:
          FFMPEG_DIR: ${{ github.workspace }}/vendor/macos
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,${{ github.workspace }}/vendor/macos/lib"
      - name: Release build
        run: cargo build --release
        env:
          FFMPEG_DIR: ${{ github.workspace }}/vendor/macos
          RUSTFLAGS: "-C link-arg=-Wl,-rpath,${{ github.workspace }}/vendor/macos/lib"
      - run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: transform-video-macos
          path: dist/transform-video-macos.zip

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      FFMPEG_DIR: '${{ github.workspace }}\vendor\windows'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pwsh ./scripts/vendor-windows.ps1
      # 测试可执行文件运行时要能找到 vendor 的 dll,需把 bin 加入 PATH
      - name: Test
        shell: pwsh
        run: |
          $env:PATH = "$env:FFMPEG_DIR\bin;$env:PATH"
          cargo test --all
      - run: cargo build --release
      - run: pwsh ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: transform-video-win64
          path: dist/transform-video-win64.zip
